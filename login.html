<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>HMD Décor | تسجيل الدخول</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0b0b0b;
  color:#fff;
  font-family:Arial,sans-serif;
}

.login-box{
  width:90%;
  max-width:420px;
  background:#151515;
  border:1px solid #2c2c2c;
  border-radius:18px;
  padding:30px 25px;
  box-shadow:0 15px 50px rgba(0,0,0,.5);
}

.logo{
  text-align:center;
  color:#c9a45c;
  font-size:30px;
  font-weight:bold;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#aaa;
  margin-bottom:30px;
}

label{
  display:block;
  margin:15px 0 8px;
  color:#ddd;
}

input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #333;
  background:#0b0b0b;
  color:#fff;
  font-size:16px;
  outline:none;
}

button{
  width:100%;
  margin-top:25px;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#c9a45c;
  color:#111;
  font-size:17px;
  font-weight:bold;
}

#message{
  text-align:center;
  margin-top:18px;
  min-height:25px;
  line-height:1.6;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#c9a45c;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">HMD Décor</div>

  <div class="subtitle">
    🔐 الدخول إلى لوحة الإدارة
  </div>

  <form id="loginForm">

    <label for="email">البريد الإلكتروني</label>

    <input
      type="email"
      id="email"
      placeholder="أدخل بريدك الإلكتروني"
      required
    >

    <label for="password">كلمة المرور</label>

    <input
      type="password"
      id="password"
      placeholder="أدخل كلمة المرور"
      required
    >

    <button type="submit" id="loginButton">
      دخول
    </button>

  </form>

  <div id="message"></div>

  <a class="back" href="index.html">
    ← العودة إلى الموقع
  </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>

const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");

const ADMIN_EMAIL = "midomidox447@gmail.com";
const ADMIN_UID = "03459448-2358-4234-a132-edb18b822795";

form.addEventListener("submit", async function(e){

  e.preventDefault();

  message.style.color = "#c9a45c";
  message.textContent = "⏳ جاري تسجيل الدخول...";
  button.disabled = true;

  try {

    const client = window.supabase.createClient(
      window.HMD_CONFIG.SUPABASE_URL,
      window.HMD_CONFIG.SUPABASE_ANON_KEY
    );

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const result = await client.auth.signInWithPassword({
      email: email,
      password: password
    });

    if(result.error){

      message.style.color = "#e57373";
      message.textContent = "❌ " + result.error.message;

      button.disabled = false;
      return;
    }

    if(!result.data || !result.data.user){

      message.style.color = "#e57373";
      message.textContent = "❌ لم يتم العثور على الحساب.";

      button.disabled = false;
      return;
    }

    if(
      result.data.user.email.toLowerCase() !==
      ADMIN_EMAIL.toLowerCase()
    ){

      await client.auth.signOut();

      message.style.color = "#e57373";
      message.textContent = "⛔ هذا الحساب غير مصرح له.";

      button.disabled = false;
      return;
    }

    if(result.data.user.id !== ADMIN_UID){

      await client.auth.signOut();

      message.style.color = "#e57373";
      message.textContent = "⛔ حساب الإدارة غير مطابق.";

      button.disabled = false;
      return;
    }

    message.style.color = "#7bd88f";
    message.textContent = "✅ تم الدخول بنجاح...";

    setTimeout(function(){

      window.location.href = "admin.html";

    },1000);

  } catch(error){

    console.error(error);

    message.style.color = "#e57373";
    message.textContent =
      "❌ حدث خطأ: " + error.message;

    button.disabled = false;
  }

});

</script>

</body>
</html>
