<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>HMD Décor | تسجيل الدخول</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0b0b0b;
  color:#fff;
  font-family:Arial,sans-serif;
}

.login-box{
  width:90%;
  max-width:420px;
  background:#151515;
  border:1px solid #2c2c2c;
  border-radius:18px;
  padding:30px 25px;
  box-shadow:0 15px 50px rgba(0,0,0,.5);
}

.logo{
  text-align:center;
  color:#c9a45c;
  font-size:30px;
  font-weight:bold;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#aaa;
  margin-bottom:30px;
}

label{
  display:block;
  margin:15px 0 8px;
  color:#ddd;
}

input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #333;
  background:#0b0b0b;
  color:#fff;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#c9a45c;
}

button{
  width:100%;
  margin-top:25px;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#c9a45c;
  color:#111;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

#message{
  text-align:center;
  margin-top:18px;
  color:#e57373;
  min-height:20px;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#c9a45c;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">HMD Décor</div>

  <div class="subtitle">
    🔐 الدخول إلى لوحة الإدارة
  </div>

  <form id="loginForm">

    <label>البريد الإلكتروني</label>
    <input
      type="email"
      id="email"
      placeholder="أدخل بريدك الإلكتروني"
      required
    >

    <label>كلمة المرور</label>
    <input
      type="password"
      id="password"
      placeholder="أدخل كلمة المرور"
      required
    >

    <button type="submit">
      دخول
    </button>

  </form>

  <div id="message"></div>

  <a class="back" href="index.html">
    ← العودة إلى الموقع
  </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>

const client = supabase.createClient(
  window.HMD_CONFIG.SUPABASE_URL,
  window.HMD_CONFIG.SUPABASE_ANON_KEY
);

const ADMIN_EMAIL = "midomidox447@gmail.com";

document
  .getElementById("loginForm")
  .addEventListener("submit", async function(e){

    e.preventDefault();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("message");

    message.textContent = "جاري تسجيل الدخول...";

    const { data, error } =
      await client.auth.signInWithPassword({
        email,
        password
      });

    if(error){
      message.textContent =
        "❌ البريد الإلكتروني أو كلمة المرور غير صحيحة.";
      return;
    }

    if(
      !data.user ||
      data.user.email !== ADMIN_EMAIL
    ){
      await client.auth.signOut();

      message.textContent =
        "⛔ هذا الحساب غير مصرح له بالدخول.";

      return;
    }

    window.location.href = "admin.html";

  });

</script>

</body>
</html>
