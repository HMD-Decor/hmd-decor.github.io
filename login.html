<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>HMD Décor | تسجيل الدخول</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0b0b0b;
  color:#fff;
  font-family:Arial,sans-serif;
}

.login-box{
  width:90%;
  max-width:420px;
  background:#151515;
  border:1px solid #2c2c2c;
  border-radius:18px;
  padding:30px 25px;
  box-shadow:0 15px 50px rgba(0,0,0,.5);
}

.logo{
  text-align:center;
  color:#c9a45c;
  font-size:30px;
  font-weight:bold;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#aaa;
  margin-bottom:30px;
}

label{
  display:block;
  margin:15px 0 8px;
  color:#ddd;
}

input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #333;
  background:#0b0b0b;
  color:#fff;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#c9a45c;
}

button{
  width:100%;
  margin-top:25px;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#c9a45c;
  color:#111;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

#message{
  text-align:center;
  margin-top:18px;
  min-height:20px;
  color:#e57373;
  line-height:1.6;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#c9a45c;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">
    HMD Décor
  </div>

  <div class="subtitle">
    🔐 الدخول إلى لوحة الإدارة
  </div>

  <form id="loginForm">

    <label for="email">
      البريد الإلكتروني
    </label>

    <input
      type="email"
      id="email"
      placeholder="أدخل بريدك الإلكتروني"
      autocomplete="username"
      required
    >

    <label for="password">
      كلمة المرور
    </label>

    <input
      type="password"
      id="password"
      placeholder="أدخل كلمة المرور"
      autocomplete="current-password"
      required
    >

    <button
      type="submit"
      id="loginButton"
    >
      دخول
    </button>

  </form>

  <div id="message"></div>

  <a class="back" href="index.html">
    ← العودة إلى الموقع
  </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>

const ADMIN_EMAIL = "midomidox447@gmail.com";

const ADMIN_UID =
  "03459448-2358-4234-a132-edb18b822795";

const message =
  document.getElementById("message");

const loginForm =
  document.getElementById("loginForm");

const loginButton =
  document.getElementById("loginButton");

let client = null;


/* =========================
   إنشاء اتصال Supabase
========================= */

try{

  if(
    !window.HMD_CONFIG ||
    !window.HMD_CONFIG.SUPABASE_URL ||
    !window.HMD_CONFIG.SUPABASE_ANON_KEY
  ){

    throw new Error(
      "إعدادات Supabase غير موجودة"
    );

  }

  if(
    !window.supabase ||
    !window.supabase.createClient
  ){

    throw new Error(
      "مكتبة Supabase لم يتم تحميلها"
    );

  }

  client =
    window.supabase.createClient(
      window.HMD_CONFIG.SUPABASE_URL,
      window.HMD_CONFIG.SUPABASE_ANON_KEY,
      {
        auth:{
          persistSession:true,
          autoRefreshToken:true,
          detectSessionInUrl:false
        }
      }
    );

}catch(error){

  console.error(
    "Supabase initialization error:",
    error
  );

  message.style.color = "#e57373";

  message.textContent =
    "❌ تعذر الاتصال بالنظام. تأكد من ملفات الموقع.";

}


/* =========================
   تسجيل الدخول
========================= */

loginForm.addEventListener(
  "submit",
  async function(e){

    e.preventDefault();

    if(!client){

      message.style.color = "#e57373";

      message.textContent =
        "❌ النظام غير جاهز. أعد تحميل الصفحة.";

      return;

    }

    const email =
      document
      .getElementById("email")
      .value
      .trim();

    const password =
      document
      .getElementById("password")
      .value;


    /* فحص البريد */

    if(
      email.toLowerCase() !==
      ADMIN_EMAIL.toLowerCase()
    ){

      message.style.color = "#e57373";

      message.textContent =
        "⛔ هذا البريد غير مصرح له بالدخول.";

      return;

    }


    message.style.color = "#c9a45c";

    message.textContent =
      "⏳ جاري تسجيل الدخول...";

    loginButton.disabled = true;


    try{

      /* تسجيل الدخول */

      const { data, error } =
        await client.auth.signInWithPassword({

          email: email,

          password: password

        });


      /* خطأ Supabase */

      if(error){

        console.error(
          "Login error:",
          error
        );

        message.style.color =
          "#e57373";

        message.textContent =
          "❌ " + (
            error.message ||
            "فشل تسجيل الدخول."
          );

        loginButton.disabled = false;

        return;

      }


      /* التأكد من وجود المستخدم */

      if(
        !data ||
        !data.user
      ){

        message.style.color =
          "#e57373";

        message.textContent =
          "❌ لم يتم العثور على بيانات المستخدم.";

        loginButton.disabled = false;

        return;

      }


      /* التأكد من وجود الجلسة */

      if(!data.session){

        message.style.color =
          "#e57373";

        message.textContent =
          "❌ تم التحقق من الحساب لكن لم يتم إنشاء الجلسة.";

        loginButton.disabled = false;

        return;

      }


      /* التحقق من البريد */

      if(
        !data.user.email ||
        data.user.email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
      ){

        await client.auth.signOut();

        message.style.color =
          "#e57373";

        message.textContent =
          "⛔ هذا الحساب غير مصرح له.";

        loginButton.disabled = false;

        return;

      }


      /* التحقق من UID */

      if(
        data.user.id !== ADMIN_UID
      ){

        console.error(
          "UID mismatch:",
          data.user.id
        );

        await client.auth.signOut();

        message.style.color =
          "#e57373";

        message.textContent =
          "⛔ حساب الإدارة غير مطابق.";

        loginButton.disabled = false;

        return;

      }


      /* =========================
         كل شيء صحيح
      ========================= */

      message.style.color =
        "#7bd88f";

      message.textContent =
        "✅ تم الدخول بنجاح... جاري فتح لوحة الإدارة";


      /* التأكد مرة أخرى أن الجلسة محفوظة */

      const {
        data: sessionData
      } =
        await client.auth.getSession();


      if(
        !sessionData ||
        !sessionData.session
      ){

        message.style.color =
          "#e57373";

        message.textContent =
          "❌ تعذر حفظ جلسة الدخول.";

        loginButton.disabled = false;

        return;

      }


      /* الانتقال إلى لوحة الإدارة */

      setTimeout(function(){

        window.location.replace(
          "admin.html"
        );

      },800);


    }catch(error){

      console.error(
        "Unexpected login error:",
        error
      );

      message.style.color =
        "#e57373";

      message.textContent =
        "❌ حدث خطأ أثناء الاتصال. حاول مرة أخرى.";

      loginButton.disabled = false;

    }

  }
);

</script>

</body>
</html>
